 <!DOCTYPE html>
    <html lang="he" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>רכישת שירות וקביעת תור</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: #f4f6f9;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                color: #333;
            }
            .card {
                background: #ffffff;
                padding: 40px;
                border-radius: 16px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                text-align: center;
                max-width: 400px;
                width: 100%;
            }
            h1 {
                font-size: 24px;
                color: #1a202c;
                margin-bottom: 12px;
            }
            p {
                color: #4a5568;
                font-size: 16px;
                margin-bottom: 24px;
                line-height: 1.5;
            }
            .btn {
                display: inline-block;
                background-color: #3182ce;
                color: white;
                text-decoration: none;
                padding: 14px 28px;
                font-size: 16px;
                font-weight: bold;
                border-radius: 8px;
                transition: background-color 0.2s, transform 0.1s;
                box-shadow: 0 4px 12px rgba(49, 130, 206,.3);
            }
            .btn:hover {
                background-color: #2b6cb0;
            }
            .btn:active {
                transform: scale(0.98);
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>השירות שלנו</h1>
            <p>לחץ על הכפתור למטה כדי לעבור לתהליך התשלום המאובטח ולאחר מכן לקבוע את התור שלך בקלות.</p>
            <!-- כאן אפשר לשים את הקישור האמיתי לדף התשלום של Grow או לנקודת הקצה שיצרנו קודם -->
            <a href="https://api.grow.business/your-payment-link" class="btn">מעבר לתשלום</a>
        </div>
    </body>
    </html>
